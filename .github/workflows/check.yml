# Checks every change: the Python tools' lint and format, the chapters' format, every
# move, square and shape on the board, both languages, Lichess's limits, and the files
# built from them. Then says which chapters of the live studies the change would rewrite.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt ruff==0.16.9
      - name: The Python tools' lint and format
        run: |
          ruff check tools research/scripts
          ruff format --check tools research/scripts
      - name: The chapters' format
        run: python3 tools/format.py --check
      - name: Every chapter on the board, and the files built from them
        run: python3 tools/build.py --check
      - name: The chapters of the live studies this would rewrite
        # Lichess may be slow to answer a runner: a failure here doesn't fail the check.
        continue-on-error: true
        run: |
          echo "## Lichess studies" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/study.py data --dry-run --summary "$GITHUB_STEP_SUMMARY"
