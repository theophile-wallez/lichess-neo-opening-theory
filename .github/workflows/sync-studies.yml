# Brings the two public Lichess studies in line with main: only the chapters that
# changed are rewritten, in place (tools/study.py). Needs the LICHESS_TOKEN secret,
# a study:write token of the studies' owner; without it, it only says what it would do.
name: Sync the studies

on:
  push:
    branches: [main]
    paths:
      - 'theory/**'
      - 'tools/theory.py'
      - 'tools/split.py'
      - 'data/*.pgn'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only say what would change
        type: boolean
        default: true
      rebuild:
        description: Import every chapter anew (chapter links change)
        type: boolean
        default: false

# One sync at a time, none cancelled halfway.
concurrency:
  group: sync-studies
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: The PGN is what the chapters give
        run: python3 tools/build.py --check
      - name: Sync
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          echo "## Lichess studies" >> "$GITHUB_STEP_SUMMARY"
          args=(data --summary "$GITHUB_STEP_SUMMARY")
          if [ -z "$LICHESS_TOKEN" ] || [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$REBUILD" = "true" ]; then args+=(--rebuild); fi
          python3 tools/study.py "${args[@]}"
      - name: Record the new chapter ids after a rebuild
        run: |
          if git diff --quiet studies.json; then exit 0; fi
          python3 tools/build.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add studies.json docs/data
          git commit -m "Record the rebuilt studies' chapter ids"
          git push
